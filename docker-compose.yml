version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: edutrack_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: edutrack
    ports:
      - '5432:5432'
    volumes:
      - edutrack_pgdata:/var/lib/postgresql/data

volumes:
  edutrack_pgdata:
